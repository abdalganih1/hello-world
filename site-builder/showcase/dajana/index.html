<body>
<main id="site"></main>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="../../templates/templates.js"></script>
<script src="../../templates/plexi.js"></script>
<script src="products.js"></script>
<script src="dajana.js"></script>
<script src="../../engine/sections.js"></script>
<script src="../../engine/scenes.js"></script>
<script src="../../engine/motion.js"></script>
<script src="../../engine/render.js"></script>
<script src="../../engine/plexi.js"></script>
<script src="../../engine/plexi-models.js"></script>
<script src="../../engine/plexi-studio.js"></script>
<script src="../../engine/plexi-product.js"></script>
<script src="../../engine/plexi-shop.js"></script>
<script>
  // دجانة: الصفحة بتنبني فوراً من آخر نسخة منتجات محفوظة بالمتصفح، والمنتجات الحيّة بتتحدّث بالخلفية للزيارة الجاية
  // صفحة المنتج: /product/<id> (أو ?p=<id> القديم) بتنفتح كصفحة كاملة
  (function () {
    const m = location.pathname.match(/^\/product\/([\w-]+)/), pid = m ? m[1] : new URLSearchParams(location.search).get("p");
    const local = !/technoenjaz|workers\.dev/.test(location.hostname);
    const KEY = "dj_items_v1", get = () => { try { const x = JSON.parse(localStorage.getItem(KEY)); return Array.isArray(x) && x.length ? x : null; } catch (e) { return null; } };
    const save = (x) => { try { localStorage.setItem(KEY, JSON.stringify(x)); } catch (e) {} };
    const go = (items) => {
      window.DAJANA_ITEMS = items;
      SAMMEM.render(Object.assign(DAJANA_CFG(items), { product: pid || "", productUrl: local ? "?p={id}" : "/product/{id}", homeUrl: local ? "" : "/" }));
      restore();
    };
    // نفس مكان السحب لما يرجع للخلف
    const SK = "dj_y:" + location.pathname + location.search;
    const restore = () => { try { const y = +sessionStorage.getItem(SK); if (y > 0) { history.scrollRestoration = "manual"; requestAnimationFrame(() => scrollTo(0, y)); setTimeout(() => scrollTo(0, y), 250); } } catch (e) {} };
    addEventListener("pagehide", () => { try { sessionStorage.setItem(SK, String(Math.round(scrollY))); } catch (e) {} });
    const cached = get();
    if (cached && (!pid || cached.some((x) => x.id === pid))) { go(cached); DAJANA_LIVE(6000).then((x) => { if (x !== cached) save(x); }); }
    else DAJANA_LIVE().then((x) => { save(x); go(x); });
    // بعد ما تهدا الصفحة: منخزّن صور كل المنتجات بالمتصفح، حتى فتح أي منتج يكون فوري
    const warm = () => { const list = (window.DAJANA_ITEMS || []).flatMap((x) => [x.thumb, x.imgs && x.imgs[0]]).filter(Boolean); let i = 0;
      const next = () => { if (i >= list.length) return; const u = list[i++]; fetch(u, { priority: "low" }).catch(() => {}).finally(() => setTimeout(next, 60)); }; next(); };
    addEventListener("load", () => setTimeout(() => (window.requestIdleCallback || setTimeout)(warm), 2500));
    // لمسة على بطاقة: منبلّش نحمّل صورة المنتج الكبيرة قبل ما تفتح الصفحة
    addEventListener("pointerdown", (e) => { const c = e.target.closest && e.target.closest(".px-card"); const it = c && (window.DAJANA_ITEMS || [])[+c.dataset.i]; if (it && it.imgs && it.imgs[0]) new Image().src = it.imgs[0]; }, { passive: true });
  })();
</script>
</body>
</html>

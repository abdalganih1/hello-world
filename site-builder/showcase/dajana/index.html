<script>
  // دجانة: منحمّل المنتجات الحيّة (بحد أقصى ثانيتين ونص) وبعدين منبني الصفحة
  // صفحة المنتج: /product/<id> (أو ?p=<id> القديم) بتنفتح كصفحة كاملة بدل نافذة
  const m = location.pathname.match(/^\/product\/([\w-]+)/), pid = m ? m[1] : new URLSearchParams(location.search).get("p");
  DAJANA_LIVE().then((items) => {
    window.DAJANA_ITEMS = items;
    const local = !/technoenjaz|workers\.dev/.test(location.hostname);
    SAMMEM.render(Object.assign(DAJANA_CFG(items), { product: pid || "", productUrl: local ? "?p={id}" : "/product/{id}", homeUrl: local ? "" : "/" }));
  });
</script>

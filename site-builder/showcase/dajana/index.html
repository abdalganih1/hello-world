<script>
  // دجانة: منحمّل المنتجات الحيّة (بحد أقصى ثانيتين ونص) وبعدين منبني الصفحة
  DAJANA_LIVE().then((items) => {
    window.DAJANA_ITEMS = items;
    const site = SAMMEM.render(DAJANA_CFG(items));
    // رابط منتج مباشر: /?p=<id>
    const pid = new URLSearchParams(location.search).get("p");
    if (pid) { const i = items.findIndex((x) => x.id === pid); if (i > -1) setTimeout(() => document.querySelector(`[data-px-open="${i}"]`)?.click(), 600); }
  });
</script>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دجانة · قطع بلكسي وهدايا بالاسم</title>
<meta name="description" content="ستاندات خطوبة وعقد قران، دروع تخرج، توزيعات مواليد وهدايا بالاسم من دجانة.">
<link rel="icon" href="img/logo.png">
<meta property="og:image" content="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;700&family=Tajawal:wght@400;500;700&family=Readex+Pro:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Changa:wght@500;700;800&display=swap">
<link rel="stylesheet" href="../../engine/engine.css">
<link rel="stylesheet" href="../../engine/plexi.css">
</head>
<body>
<main id="site"></main>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="../../templates/templates.js"></script>
<script src="../../templates/plexi.js"></script>
<script src="products.js"></script>
<script src="dajana.js"></script>
<script src="../../engine/sections.js"></script>
<script src="../../engine/scenes.js"></script>
<script src="../../engine/motion.js"></script>
<script src="../../engine/render.js"></script>
<script src="../../engine/plexi.js"></script>
<script>
  // الإعدادات من الرابط (?t=clinic&palette=luxe&name=...) أو من واجهة صمّم عبر postMessage
  let started = false;
  const start = (cfg) => { if (started) return; started = true; SAMMEM.render(cfg); };
  const fromUrl = SAMMEM.readConfig();
  if (window.SAMMEM_SITE) start(window.SAMMEM_SITE); // موقع منشور: الإعدادات محقونة من الـ Worker
  else if (!fromUrl.embed && (fromUrl.t || window.parent === window)) start(fromUrl);
  else {
    addEventListener("message", (e) => { if (e.data && e.data.type === "sammem:config") start(e.data.cfg); });
    parent.postMessage({ type: "sammem:ready" }, "*");
    setTimeout(() => start(fromUrl), 4000);
  }
</script>
</body>
</html>

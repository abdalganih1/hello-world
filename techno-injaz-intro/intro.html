<!doctype html>
<html lang="ar" dir="ltr">
<head>
<meta charset="utf-8">
<title>Techno Injaz Intro</title>
<style>
  @font-face { font-family: Cairo; src: url(assets/cairo-800.ttf); font-weight: 800; }
  @font-face { font-family: Cairo; src: url(assets/cairo-900.ttf); font-weight: 900; }
  @font-face { font-family: JB; src: url(assets/jbmono-800.ttf); font-weight: 800; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: clip; background: #02030a; }
  #stage { position: fixed; top: 0; left: 0; width: 1080px; height: 1920px; overflow: clip; contain: paint; background: #02030a; }
  #shake { position: absolute; inset: 0; transform-origin: 540px 960px; }
  canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }

  /* Logo world: children are laid out in "logo units" (4x source pixels) */
  #cam { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .piece, .glint { position: absolute; left: 0; top: 0; display: block; }
  .glint { -webkit-mask-size: 100% 100%; mask-size: 100% 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; mix-blend-mode: screen;
    background: linear-gradient(105deg, transparent 42%, rgba(255,255,255,.9) 50%, transparent 58%); background-size: 320% 100%; background-position: 100% 0; opacity: 0; }
  #dotSocket, #dotsvg { position: absolute; overflow: visible; }
  #dotsvg { transform-origin: 50% 50%; }

  #halo { position: absolute; width: 1400px; height: 1400px; margin: -700px 0 0 -700px; border-radius: 50%; opacity: 0;
    background: radial-gradient(circle, rgba(60,205,190,.55), rgba(74,111,214,.28) 40%, transparent 68%); }

  #cursor { position: absolute; left: 0; top: 0; width: 92px; height: 92px; opacity: 0; transform-origin: 8px 6px; filter: drop-shadow(0 8px 10px rgba(0,0,0,.6)); }

  /* Text layers sit above the shaking world */
  #caption { position: absolute; left: 0; width: 1080px; top: 300px; text-align: center; direction: rtl; font: 800 66px/1.35 Cairo, sans-serif; color: #fff; opacity: 0; text-shadow: 0 6px 30px rgba(0,0,0,.7); }
  #caption em { font-style: normal; color: #ffb020; }
  #hello { position: absolute; left: 0; width: 1080px; top: 930px; text-align: center; direction: ltr; font: 800 96px/1.2 JB, monospace; color: #fff; white-space: pre; opacity: 0; text-shadow: 0 0 40px rgba(60,205,190,.55), 0 8px 30px rgba(0,0,0,.6); }
  #hello .row { position: relative; display: inline-block; }
  #hello .prompt { color: #3cc9b6; }
  #hello .c { opacity: 0; }
  #caret { position: absolute; top: 12px; width: 44px; height: 90px; background: #3cc9b6; opacity: 0; box-shadow: 0 0 24px rgba(60,205,190,.9); }
  #emoji { display: inline-block; transform-origin: 50% 60%; opacity: 0; font-family: JB, "Noto Color Emoji", sans-serif; }
  #brand { position: absolute; left: 0; width: 1080px; top: 1185px; text-align: center; opacity: 0; }
  #brand .ar { font: 900 84px/1.2 Cairo, sans-serif; color: #fff; direction: rtl; }
  #brand .en { font: 800 38px/1.4 JB, monospace; color: #6fe6d5; letter-spacing: 15px; margin-top: 4px; padding-left: 14px; }
  #brand .bar { width: 120px; height: 5px; margin: 18px auto 0; border-radius: 3px; background: linear-gradient(90deg, #4a6fd6, #3cc9b6); }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #fade { position: absolute; inset: 0; background: #000; opacity: 1; pointer-events: none; }
</style>
</head>
<body>

        <g id="roomLayer">

            <!-- window with night sky -->

              <rect x="42" y="40" width="48" height="48" rx="3" fill="#060a26"/>

              <rect x="42" y="40" width="48" height="48" rx="3" fill="none" stroke="#3b4d9f" stroke-width="3"/>
            </g>
            <!-- rocket poster (foreshadowing) -->

            <!-- shelf + plant + books -->

            <g fill="#3fbf8a"><ellipse cx="155.6" cy="66" rx="2.6" ry="7" transform="rotate(-20 155.6 66)"/><ellipse cx="155.6" cy="66" rx="2.6" ry="7.5" transform="rotate(22 155.6 66)"/><ellipse cx="155.6" cy="65" rx="2.4" ry="7"/></g>
            <rect x="164" y="72" width="4" height="12" fill="#ffb020"/><rect x="168.5" y="70" width="4" height="14" fill="#4a76d0"/><rect x="173" y="74" width="3.5" height="10" fill="#e5546b"/>
            <!-- desk -->
            <rect x="0" y="130" width="200" height="80" fill="#1a2566"/>

            <!-- monitor -->
            <rect x="121" y="118" width="7" height="12" fill="#0c1238"/><rect x="110" y="128" width="29" height="3" rx="1.5" fill="#0c1238"/>
            <rect x="92" y="78" width="66" height="44" rx="4" fill="#0a0f31" stroke="#33449a" stroke-width="2"/>

            <!-- keyboard, mug + steam -->
            <rect x="98" y="127" width="44" height="3.6" rx="1.8" fill="#0c1238"/><g fill="#33449a"><rect x="101" y="128" width="6" height="1.2"/><rect x="110" y="128" width="6" height="1.2"/><rect x="119" y="128" width="6" height="1.2"/><rect x="128" y="128" width="6" height="1.2"/></g>
            <rect x="162" y="114" width="12" height="14" rx="2.2" fill="#f3f5ff"/><path d="M174 118 h3 a3.4 3.4 0 0 1 0 8 h-3" stroke="#f3f5ff" fill="none" stroke-width="1.8"/>
            <path class="steam" d="M165 111 q-3 -4 0 -7 q3 -3 0 -7" fill="none" stroke="#dfe6ff" stroke-width="1.4" stroke-linecap="round" opacity=".5"/>
            <path class="steam" d="M171 111 q-3 -4 0 -7 q3 -3 0 -7" fill="none" stroke="#dfe6ff" stroke-width="1.4" stroke-linecap="round" opacity=".4"/>
            <!-- programmer (seen from behind) -->
            <rect x="40" y="108" width="58" height="90" rx="18" fill="#27358a"/>

              <path d="M44 200 L44 156 C44 132 54 122 68 122 C82 122 92 132 92 156 L92 200 Z" fill="#2fc4b2"/><path d="M60 200 L60 150 M76 200 L76 150" stroke="#249a8c" stroke-width="1.4" opacity=".6"/>
              <path d="M92 200 L92 156 C92 136 86 126 78 123" fill="none" stroke="#9af5e6" stroke-width="1.6" stroke-linecap="round"/>
              <rect x="63" y="112" width="9" height="11" rx="3" fill="#d39c74"/>
              <circle cx="68" cy="103" r="11" fill="#1a1236"/>
              <path d="M78 98 a11 11 0 0 1 -2 12" fill="none" stroke="#7ff0e0" stroke-width="1.4" stroke-linecap="round"/>
              <path d="M57 103 a11 11 0 0 1 22 0" fill="none" stroke="#ffb020" stroke-width="2.6" stroke-linecap="round"/>
              <rect x="76" y="100" width="5" height="9" rx="2.4" fill="#ffb020"/>
              <path id="arm" d="M84 132 L99 132" stroke="#2fc4b2" stroke-width="8.5" stroke-linecap="round" fill="none"/>

        <circle cx="100" cy="100" r="96" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="2.4"/>
        <circle id="dhot" cx="100" cy="100" r="100" fill="#eafffb" opacity="0"/>
        <circle cx="100" cy="100" r="100" fill="url(#dshine)"/>
      </svg>
    </div>
    <canvas id="fx" width="1080" height="1920"></canvas>
    <svg id="cursor" viewBox="0 0 24 24"><path d="M3 2 L3 19.5 L7.6 15.4 L10.6 22 L13.6 20.7 L10.7 14.2 L16.8 13.8 Z" fill="#fff" stroke="#0b1030" stroke-width="1.3" stroke-linejoin="round"/></svg>
  </div>
  <div id="caption">مبرمج صغير.. <em>بحلم كبير</em></div>
  <div id="hello"><span class="row"><span class="prompt c">&gt;</span><span class="c"> </span><span id="chars"></span><span id="sp"> </span><span id="emoji">🌍</span><span id="caret"></span></span></div>
  <div id="brand"><div class="ar">تكنو انجاز</div><div class="en">TECHNO INJAZ</div><div class="bar"></div></div>
  <div id="flash"></div>
  <div id="fade"></div>
</div>

<script>
const W = 1080, HH = 1920;
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const sm = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const lerp = (a, b, x) => a + (b - a) * x;
const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eoc = (x) => 1 - Math.pow(1 - x, 3);
const eob = (x, c = 1.8) => 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2);
const rnd = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

let LOGO = null, T = null, TICKS = [];
const Z_FIN_W = 640;          // launch-size logo width in px
const HELLO = "Hello world";

// ---------- setup ----------
window.setup = function (logo, tl, ticks) {
  LOGO = logo; T = tl; TICKS = ticks;
  const [Wc, Hc] = logo.canvas;
  const pieces = logo.pieces;
  const xs = Object.values(pieces).map((p) => [p.bbox[0], p.bbox[0] + p.bbox[2]]);
  const ys = Object.values(pieces).map((p) => [p.bbox[1], p.bbox[1] + p.bbox[3]]);
  LOGO.bb = { x0: Math.min(...xs.map((v) => v[0])), x1: Math.max(...xs.map((v) => v[1])), y0: Math.min(...ys.map((v) => v[0])), y1: Math.max(...ys.map((v) => v[1])) };
  LOGO.bb.cx = (LOGO.bb.x0 + LOGO.bb.x1) / 2; LOGO.bb.cy = (LOGO.bb.y0 + LOGO.bb.y1) / 2;
  LOGO.Z1 = Z_FIN_W / (LOGO.bb.x1 - LOGO.bb.x0);
  LOGO.Z2 = 470 / (LOGO.bb.x1 - LOGO.bb.x0);
  LOGO.Z0 = 700 / (2 * logo.dot.r);
  $("cam").style.width = Wc + "px"; $("cam").style.height = Hc + "px";
  for (const n of ["top", "left", "right"]) {
    const p = pieces[n];
    for (const id of ["p-" + n, "g-" + n]) {
      const el = $(id); el.style.width = Wc + "px"; el.style.height = Hc + "px";
      el.style.transformOrigin = `${p.centroid[0]}px ${p.centroid[1]}px`;
    }
    const g = $("g-" + n); g.style.webkitMaskImage = g.style.maskImage = `url(assets/logo/${n}.png)`;
  }
  const d = logo.dot, sz = d.r * 2;
  for (const id of ["dotsvg"]) { const e = $(id); e.style.left = d.cx - d.r + "px"; e.style.top = d.cy - d.r + "px"; e.style.width = sz + "px"; e.style.height = sz + "px"; }
  const so = $("dotSocket"), sr = d.r * 1.3;
  so.style.left = d.cx - sr + "px"; so.style.top = d.cy - sr + "px"; so.style.width = sr * 2 + "px"; so.style.height = sr * 2 + "px";
  so.style.opacity = 0;

  // code lines on the monitor
  const g = $("code"), cols = ["#58f0dc", "#8aa5ff", "#ffb020", "#e9eeff", "#58f0dc", "#c58bff", "#8aa5ff", "#e9eeff"];
  const ind = [0, 5, 5, 10, 5, 0, 5, 10];
  const len = [30, 40, 26, 34, 44, 20, 38, 28];
  window.CODE = cols.map((c, i) => {
    const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    r.setAttribute("x", 99 + ind[i]); r.setAttribute("y", 86 + i * 4.1); r.setAttribute("height", 2.2); r.setAttribute("rx", 1.1); r.setAttribute("fill", c);
    r.setAttribute("width", 0); g.appendChild(r); return { r, len: len[i], ind: ind[i] };
  });
  // typed text spans
  const chars = $("chars");
  for (const ch of HELLO) { const s = document.createElement("span"); s.className = "c"; s.textContent = ch; chars.appendChild(s); }
  window.CHARS = [...chars.children];
  window.PROMPT = document.querySelectorAll("#hello .c");

  // static scenery
  window.STARS = Array.from({ length: 280 }, (_, i) => ({ x: rnd(i) * W, y: rnd(i + 900) * (HH + 400), r: 0.6 + rnd(i + 1800) * 1.9, p: rnd(i + 2700) * 6.28, s: 0.6 + rnd(i + 3600) * 2.4 }));
  window.CLOUDS = Array.from({ length: 26 }, (_, i) => ({ x: rnd(i + 50) * 1300 - 110, z: 1150 + rnd(i + 150) * 2300, s: 0.7 + rnd(i + 250) * 0.9, par: 1 + rnd(i + 350) * 0.6, n: 5 + Math.floor(rnd(i + 450) * 4) }));
  window.BUILD = Array.from({ length: 30 }, (_, i) => ({ x: -40 + i * 40 + rnd(i) * 14, w: 50 + rnd(i + 70) * 70, h: 70 + rnd(i + 140) * 230, far: i % 3 === 0 }));
  window.SYMS = Array.from({ length: 16 }, (_, i) => ({ t: ["</>", "{ }", "01", "();", "=>", "#", "[]", "&&"][i % 8], x: rnd(i + 11) * W, y: rnd(i + 31) * HH, s: 40 + rnd(i + 61) * 50, v: 14 + rnd(i + 91) * 26 }));
  window.CONT = [
    [0, 60, 300, 130, "#38a86b"], [420, 90, 280, 150, "#2f9a63"], [900, 40, 340, 120, "#3aa76d"], [1350, 100, 260, 160, "#44b071"], [1800, 60, 320, 140, "#2f9a63"],
    [230, 190, 200, 90, "#c4a86a"], [1100, 200, 240, 80, "#c9ae6e"], [1620, 210, 200, 80, "#c4a86a"],
  ];
};

// ---------- physics ----------
const ACC = 950, KD = 1.6;
function Hf(t) {
  const tau = t - T.liftoff; if (tau <= 0) return 0;
  const tc = T.cut - T.liftoff;
  if (tau <= tc) return 0.5 * ACC * tau * tau;
  return 0.5 * ACC * tc * tc + ACC * tc * (1 - Math.exp(-KD * (tau - tc))) / KD;
}
function Vf(t) {
  const tau = t - T.liftoff; if (tau <= 0) return 0;
  const tc = T.cut - T.liftoff;
  return tau <= tc ? ACC * tau : ACC * tc * Math.exp(-KD * (tau - tc));
}
const LMAX = 330, PADY = 1232;
const powerAt = (t) => sm((t - T.ignite) / 0.3) * (1 - sm((t - T.cut) / 0.18));

// ---------- helpers ----------
function skyAt(A) {
  const K = [[0, [8, 12, 40], [24, 36, 96], [240, 130, 90]], [900, [6, 9, 32], [15, 26, 80], [70, 80, 170]], [2200, [3, 5, 20], [6, 10, 40], [14, 22, 80]], [3600, [1, 2, 10], [2, 4, 20], [4, 8, 36]]];
  let i = 0; while (i < K.length - 2 && A > K[i + 1][0]) i++;
  const f = clamp((A - K[i][0]) / (K[i + 1][0] - K[i][0]));
  const mix = (a, b) => `rgb(${a.map((v, j) => Math.round(lerp(v, b[j], f))).join(",")})`;
  return [mix(K[i][1], K[i + 1][1]), mix(K[i][2], K[i + 1][2]), mix(K[i][3], K[i + 1][3])];
}

// ---------- main ----------
window.seek = function (t) {
  const bg = $("bg").getContext("2d"), fx = $("fx").getContext("2d");
  const d = LOGO.dot, bb = LOGO.bb;
  const H = Hf(t), V = Vf(t);
  const L = LMAX * Math.tanh(H / LMAX);
  const A = H - L;                                  // camera altitude
  const P = powerAt(t);

  // ----- zoom / camera -----
  const zp = eio(clamp((t - T.zoomStart) / (T.zoomEnd - T.zoomStart)));
  const zStart = LOGO.Z0 * (1 + 0.045 * sm(t / T.zoomStart));
  let Z = t < T.zoomStart ? zStart : zStart * Math.pow(LOGO.Z1 / zStart, zp);
  let Fx = lerp(d.cx, bb.cx, zp), Fy = lerp(d.cy, bb.cy, zp);
  let sx = 540, sy = 880 - L;
  // settle into the final brand position
  const sp = eio(clamp((t - (T.cut + 0.12)) / (T.settleEnd - T.cut - 0.12)));
  Z = lerp(Z, LOGO.Z2, sp); sy = lerp(sy, 600, sp);
  const floatY = sp >= 1 || t > T.settleEnd ? Math.sin((t - T.settleEnd) * 1.6) * 9 * sm((t - T.settleEnd) / 0.6) : 0;
  sy += floatY;
  // rumble
  let amp = 0;
  if (t > T.ignite && t < T.cut + 0.25) {
    const a1 = sm((t - T.ignite) / (T.liftoff - T.ignite));
    amp = t < T.liftoff ? 2 + 5 * a1 : (t < T.liftoff + 1.6 ? lerp(9, 5, sm((t - T.liftoff) / 1.6)) : 5);
    amp *= 1 - sm((t - T.cut) / 0.25);
  }
  const jf = Math.floor(t * 60);
  const jx = (rnd(jf) - 0.5) * amp * 0.9, jy = (rnd(jf + 77) - 0.5) * amp * 0.9, jr = (rnd(jf + 33) - 0.5) * amp * 0.06;
  // landing thumps as pieces snap into place
  let thump = 0;
  for (const k of ["top", "left", "right"]) { const a = t - (T.asm[k] + 0.55); if (a > 0) thump += Math.exp(-a / 0.09); }
  Z *= 1 + 0.018 * thump;
  const sway = t > T.liftoff && t < T.cut ? Math.sin((t - T.liftoff) * 3.1) * 0.5 * sm((t - T.liftoff) / 0.8) : 0;
  const cam = { sx: sx + jx, sy: sy + jy, rot: jr + sway, Z, Fx, Fy };
  const toScreen = (u, v) => {
    const px = (u - cam.Fx) * cam.Z, py = (v - cam.Fy) * cam.Z, r = cam.rot * Math.PI / 180;
    return [cam.sx + px * Math.cos(r) - py * Math.sin(r), cam.sy + px * Math.sin(r) + py * Math.cos(r)];
  };
  $("cam").style.transform = `translate(${cam.sx}px,${cam.sy}px) rotate(${cam.rot}deg) scale(${cam.Z}) translate(${-cam.Fx}px,${-cam.Fy}px)`;

  // ----- pieces: assemble -----
  const START = { top: [0, -1500, 18], left: [-1500, 500, -40], right: [1500, 500, 40] };
  for (const n of ["top", "left", "right"]) {
    const pp = clamp((t - T.asm[n]) / 0.6), a = eob(pp, 1.4);
    const [ox, oy, orot] = START[n];
    const tr = `translate(${(1 - a) * ox}px,${(1 - a) * oy}px) rotate(${(1 - a) * orot}deg) scale(${lerp(0.7, 1, a)})`;
    const el = $("p-" + n), gl = $("g-" + n);
    el.style.transform = tr; gl.style.transform = tr;
    el.style.opacity = clamp(pp * 8);
    el.style.filter = pp < 1 ? `blur(${(1 - pp) * 14}px)` : "none";
  }
  // glints sweep across the logo when assembled and again when it settles

      if (s < 1) continue;
      fx.fillStyle = "rgba(255,255,255,.95)"; fx.beginPath();
      fx.moveTo(cxk, cyk - s * 1.6); fx.quadraticCurveTo(cxk, cyk, cxk + s, cyk); fx.quadraticCurveTo(cxk, cyk, cxk, cyk + s * 1.6); fx.quadraticCurveTo(cxk, cyk, cxk - s, cyk); fx.quadraticCurveTo(cxk, cyk, cxk, cyk - s * 1.6); fx.fill();
    }
  }
  // emoji burst
  const ba = (t - T.emoji) / 1.0;
  if (ba > 0 && ba < 1) {
    const ex = window.EMOJI_X || 540 + 400, ey = 985;
    for (let k = 0; k < 40; k++) {
      const ang = rnd(k) * 6.283, dist = (90 + 420 * rnd(k + 60)) * eoc(ba);
      fx.fillStyle = ["rgba(60,205,190,", "rgba(255,176,32,", "rgba(255,255,255,", "rgba(110,150,255,"][k % 4] + (1 - ba) + ")";
      fx.beginPath(); fx.arc(ex + Math.cos(ang) * dist, ey + Math.sin(ang) * dist, 3 + 6 * (1 - ba) * rnd(k + 9), 0, 6.283); fx.fill();
    }
  }

  // ----- text layers -----
  const cap = $("caption");
  cap.style.opacity = sm((t - 0.55) / 0.7) * (1 - sm((t - (T.zoomStart - 0.1)) / 0.45));
  cap.style.transform = `translateY(${(1 - sm((t - 0.55) / 0.7)) * 24}px)`;

  const hello = $("hello");
  const typed = clamp(Math.floor((t - T.typeStart) / T.typeStep) + 1, 0, HELLO.length);
  hello.style.opacity = sm((t - (T.typeStart - 0.3)) / 0.2);
  PROMPT.forEach((e) => (e.style.opacity = t > T.typeStart - 0.3 ? 1 : 0));
  CHARS.forEach((c, i) => (c.style.opacity = i < typed ? 1 : 0));
  const caret = $("caret"), row = hello.querySelector(".row");
  const next = typed < CHARS.length ? CHARS[typed] : $("sp");
  caret.style.left = next.offsetLeft + "px";
  caret.style.opacity = t > T.typeStart - 0.3 && t < T.emoji + 0.5 ? (typed < HELLO.length && typed > 0 ? 1 : (Math.floor(t * 2.4) % 2 ? 0.15 : 1)) : 0;
  const ea = clamp((t - T.emoji) / 0.7), em = $("emoji");
  em.style.opacity = ea > 0 ? 1 : 0;
  em.style.transform = `scale(${ea > 0 ? eob(ea, 2.6) : 0}) rotate(${(1 - eoc(ea)) * -30}deg) translateY(${Math.sin(t * 2.2) * 5 * ea}px)`;
  window.EMOJI_X = hello.getBoundingClientRect().left + em.offsetLeft + em.offsetWidth / 2 + row.offsetLeft * 0;
  const hs = 1 + 0.03 * Math.exp(-(t - T.emoji) / 0.15) * (t > T.emoji ? 1 : 0);
  hello.style.transform = `scale(${hs})`;

  const br = $("brand"), ba2 = sm((t - T.brand) / 0.7);
  br.style.opacity = ba2; br.style.transform = `translateY(${(1 - ba2) * 34}px)`;

  // ----- shake, flash, fades -----
  const sh = $("shake");
  sh.style.transform = amp > 0 ? `translate(${(rnd(jf + 5) - 0.5) * amp * 1.6}px,${(rnd(jf + 9) - 0.5) * amp * 1.6}px) scale(1.035)` : "none";
  let flash = 0;
  flash = Math.max(flash, 0.9 * Math.exp(-Math.max(0, t - T.ignite) / 0.1) * (t >= T.ignite ? 1 : 0));
  flash = Math.max(flash, 0.35 * Math.exp(-Math.max(0, t - T.cut) / 0.1) * (t >= T.cut ? 1 : 0));
  flash = Math.max(flash, 0.5 * Math.exp(-Math.max(0, t - T.emoji) / 0.1) * (t >= T.emoji ? 1 : 0));
  flash = Math.max(flash, 0.32 * Math.exp(-Math.max(0, t - T.zoomStart) / 0.12) * (t >= T.zoomStart ? 1 : 0));
  $("flash").style.opacity = flash;
  $("fade").style.opacity = Math.max(1 - sm(t / 0.7), sm((t - (T.total - 0.55)) / 0.5));
};
</script>
</body>
</html>
